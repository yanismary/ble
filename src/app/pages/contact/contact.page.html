<ion-header>
  <ion-toolbar class="mantion-navbar info-navbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/scan" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ copy.contactTitle }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="mantion-page-background">
  <main class="app-info-layout">
    <section>
      <ion-list class="legacy-contact-list">
        <ion-list-header>
          <ion-label class="contact-company-name">{{ copy.companyName }}</ion-label>
          <img src="assets/img/logo_wimove.png" alt="" />
        </ion-list-header>

        <ion-item [href]="copy.supportEmailHref" detail="false">
          <ion-icon name="mail" slot="start" aria-hidden="true"></ion-icon>
          <ion-label>
            <strong>{{ copy.sendMessage }}</strong>
            <span>{{ copy.supportEmail }}</span>
          </ion-label>
        </ion-item>

        <ion-item [href]="copy.phoneHref" detail="false">
          <ion-icon name="call" slot="start" aria-hidden="true"></ion-icon>
          <ion-label>{{ copy.phoneLabel }}</ion-label>
        </ion-item>

        <ion-item detail="false">
          <ion-icon name="location" slot="start" aria-hidden="true"></ion-icon>
          <ion-label>
            <strong>{{ copy.companyName }}</strong>
            @for (line of copy.addressLines; track line) {
              <span>{{ line }}</span>
            }
          </ion-label>
        </ion-item>
      </ion-list>
    </section>
  </main>
</ion-content>
