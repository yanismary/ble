<ion-header>
  <ion-toolbar class="mantion-navbar info-navbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/help" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ copy.aboutTitle }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="mantion-page-background">
  <main class="app-info-layout">
    <section>
      <h2>{{ copy.aboutContentTitle }}</h2>

      <ion-list class="legacy-info-list">
        <ion-item>
          <ion-label>{{ copy.versionLabel }}</ion-label>
          <ion-note slot="end">{{ appVersion }}</ion-note>
        </ion-item>
      </ion-list>

      <h3>{{ copy.lastModification }}</h3>
      <p>{{ copy.lastModificationText }}</p>
    </section>

  </main>
</ion-content>
