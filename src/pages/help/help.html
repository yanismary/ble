<ion-header>
  <ion-navbar color="navBarColor">
    <ion-title>{{"HELP_PAGE.TITLE"| translate}}</ion-title>
  </ion-navbar>
</ion-header>


<span [innerHTML]="'title' | translate"></span>

<ion-content padding>

    <div class="product-choice">
      <p text-wrap>{{"HELP_PAGE.PRODUCT_CHOICE.TITLE"| translate}}</p>
      <button ion-button block [outline]="productName !== 'WIDOOR'" (click)="selectProduct('WIDOOR')">
        {{"HELP_PAGE.PRODUCT_CHOICE.WIDOOR"| translate}}
      </button>
      <button ion-button block [outline]="productName !== 'MOVENTIV'" (click)="selectProduct('MOVENTIV')">
        {{"HELP_PAGE.PRODUCT_CHOICE.MOVENTIV"| translate}}
      </button>
    </div>
   
    <ion-list *ngIf="productName"> 
        <ion-item text-wrap (click)="hsPairing()">
          <h2 text-wrap>{{"HELP_PAGE.PAIRING.TITLE"| translate}}</h2>
          <div *ngIf="showPairing"><br/> </div>
        <span  *ngIf="showPairing && isIos" text-wrap [innerHtml]="'HELP_PAGE.PAIRING.IOS.TEXT' | translate:{productName: productName}"></span>
        <span  *ngIf="showPairing && isAndroid" text-wrap [innerHtml]="'HELP_PAGE.PAIRING.ANDROID.TEXT' | translate:{productName: productName}"></span>
        </ion-item>
        <ion-item text-wrap (click)="hsPairingTroubles()">
            <h2 text-wrap>{{"HELP_PAGE.PAIRINGTROUBLES.TITLE"| translate}}</h2>
            <div *ngIf="showPairingTroubles"><br/> </div>
          <span  *ngIf="showPairingTroubles && isIos" text-wrap [innerHtml]="'HELP_PAGE.PAIRINGTROUBLES.IOS.TEXT' | translate"></span>
          <span  *ngIf="showPairingTroubles && isAndroid" text-wrap [innerHtml]="'HELP_PAGE.PAIRINGTROUBLES.ANDROID.TEXT' | translate"></span>
          </ion-item>
        </ion-list> 

</ion-content>
